[project]
name = "itevi-core"
version = "0.1.0"
description = "Shared primitives for the I-TevI MLDE campaign: variant identity, provenance, schemas."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=15", "PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
